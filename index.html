<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aplicações Financeiras</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, Segoe UI, Arial, sans-serif; font-size: 11px; color: #000; background: #fff; width: 896px; }
  .tabtitle { background: #f0f0f0; border-bottom: 1px solid #c8c8c8; height: 26px; }
  .tabtitle span { display: inline-block; background: #3c3c64; color: #fff; font-weight: bold; padding: 6px 8px; height: 26px; }
  .toolbar { display: flex; align-items: center; height: 27px; background: #f0f0f0; border-bottom: 1px solid #c8c8c8; }
  .toolbar .cap { background: #3c3c64; color: #fff; font-weight: bold; padding: 0 6px; height: 27px; line-height: 27px; margin-right: 4px; }
  .btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid transparent; }
  .btn:hover { border-color: #7aa7d8; background: #dbe8f6; }
  .btn.dis { opacity: .35; pointer-events: none; }
  .tbtext { height: 22px; padding: 0 6px; display: inline-flex; align-items: center; cursor: pointer; border: 1px solid transparent; }
  .tbtext:hover { border-color: #7aa7d8; background: #dbe8f6; }
  .sep { width: 1px; height: 18px; background: #b0b0b0; margin: 0 4px; }
  .grid { height: 333px; border-bottom: 1px solid #c8c8c8; overflow: auto; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th { text-align: left; font-weight: bold; border-right: 1px solid #c0c0c0; border-bottom: 1px solid #c0c0c0; padding: 0 2px; height: 15px; background: #fff; }
  td { padding: 0 2px; height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  td.r, th.r { text-align: right; }
  tr.rsel td { background: #99b4d1; }
  tr.rsel td:first-child { background: #fff; outline: 1px solid #000; outline-offset: -1px; font-weight: bold; }
  .splitter { height: 20px; background: #f0f0f0; position: relative; border-bottom: 1px solid #c8c8c8; }
  .splitter::after { content: ""; position: absolute; left: 18px; top: 8px; width: 38px; height: 2px; background: #808080; }
  .tabs { display: flex; border-bottom: 1px solid #a0a0a0; padding: 2px 0 0 2px; height: 22px; background: #fff; }
  .tab { padding: 2px 5px; border: 1px solid #a0a0a0; border-bottom: none; background: #fff; font-size: 12px; font-weight: bold; position: relative; top: 1px; }
  .form { position: relative; height: 180px; }
  .f { position: absolute; display: flex; align-items: center; }
  .lbl { text-align: right; padding-right: 4px; }
  .lnk { color: #0645ad; text-decoration: underline; cursor: pointer; }
  input[type=text], select { height: 20px; border: 1px solid #a0a0a0; font: inherit; font-size: 11px; padding: 0 2px; background: #fff; }
  input:disabled, select:disabled { background: #fff; color: #000; }
  .num { text-align: right; }
  .err { border-color: #d32f2f !important; background: #ffebee !important; }
</style>
</head>
<body>
<div class="tabtitle"><span>Aplicações Financeiras</span></div>

<!-- Visual Function 1: Lista -->
<div class="toolbar">
  <div class="cap">Aplicações Financeiras</div>
  <span class="btn" title="Excluir" onclick="excluir()"><svg width="16" height="16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10M7 6v6M9 6v6" stroke="#444" fill="none"/></svg></span>
  <span class="sep"></span>
  <span class="btn" title="Primeiro" onclick="nav('p')"><svg width="16" height="16"><path d="M4 3v10M13 3L6 8l7 5z" fill="#1c2a8c" stroke="#1c2a8c"/></svg></span>
  <span class="btn" title="Anterior" onclick="nav('a')"><svg width="16" height="16"><path d="M8 3L2 8l6 5zM14 3L8 8l6 5z" fill="#1c2a8c"/></svg></span>
  <span class="btn" title="Próximo" onclick="nav('n')"><svg width="16" height="16"><path d="M2 3l6 5-6 5zM8 3l6 5-6 5z" fill="#1c2a8c"/></svg></span>
  <span class="btn" title="Último" onclick="nav('u')"><svg width="16" height="16"><path d="M12 3v10M3 3l7 5-7 5z" fill="#1c2a8c" stroke="#1c2a8c"/></svg></span>
  <span class="btn" title="Novo" onclick="novo()"><svg width="16" height="16"><path d="M3 2h7l3 3v9H3zM10 2v3h3" fill="#fff" stroke="#444"/><path d="M11 10v5M8.5 12.5h5" stroke="#2a6fd6" stroke-width="1.5"/></svg></span>
  <span class="btn" title="Relatório" onclick="relatorio()"><svg width="16" height="16"><path d="M3 2h10v12H3zM5 5h6M5 8h6M5 11h4" fill="#fff" stroke="#444"/></svg></span>
  <span class="btn" title="Localizar" onclick="localizar()"><svg width="16" height="16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#444" stroke-width="1.5"/><path d="M10 10l4 4" stroke="#444" stroke-width="2"/></svg></span>
  <span class="sep"></span>
  <span class="btn" title="Atualizar" onclick="render()"><svg width="16" height="16"><path d="M13 8a5 5 0 1 1-1.5-3.5M12 1v4H8" fill="none" stroke="#2a6fd6" stroke-width="1.5"/></svg></span>
  <span class="sep"></span>
  <span class="tbtext" title="Calcular DeRE" onclick="calcularDeRE()">Calcular DeRE</span>
</div>

<div class="grid">
  <table>
    <colgroup><col style="width:113px"><col style="width:330px"><col style="width:130px"><col></colgroup>
    <thead><tr><th>Código</th><th>Descrição do Ativo</th><th class="r">Valor Saldo Inicial</th><th>Conta Contábil</th></tr></thead>
    <tbody id="gridBody"></tbody>
  </table>
</div>

<div class="splitter"></div>

<!-- Visual Function 2: Pasta -->
<div class="toolbar">
  <div class="cap">Aplicação Financeira</div>
  <span class="btn" id="bNovo" title="Incluir" onclick="novo()"><svg width="16" height="16"><path d="M3 2h7l3 3v9H3zM10 2v3h3" fill="#fff" stroke="#444"/><path d="M11 10v5M8.5 12.5h5" stroke="#2a6fd6" stroke-width="1.5"/></svg></span>
  <span class="btn dis" id="bSalvar" title="Salvar" onclick="salvar()"><svg width="16" height="16"><path d="M2 2h10l2 2v10H2zM5 2v4h6V2M5 14V9h6v5" fill="#fff" stroke="#444"/></svg></span>
  <span class="btn dis" id="bCancelar" title="Cancelar" onclick="cancelar()"><svg width="16" height="16"><path d="M2 2h10l2 2v10H2zM5 2v4h6V2" fill="#fff" stroke="#444"/><path d="M9 9l5 5M14 9l-5 5" stroke="#c00" stroke-width="1.5"/></svg></span>
  <span class="btn" title="Excluir" onclick="excluir()"><svg width="16" height="16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10M7 6v6M9 6v6" stroke="#444" fill="none"/></svg></span>
  <span class="sep"></span>
  <span class="btn" title="Primeiro" onclick="nav('p')"><svg width="16" height="16"><path d="M4 3v10M13 3L6 8l7 5z" fill="#1c2a8c" stroke="#1c2a8c"/></svg></span>
  <span class="btn" title="Anterior" onclick="nav('a')"><svg width="16" height="16"><path d="M8 3L2 8l6 5zM14 3L8 8l6 5z" fill="#1c2a8c"/></svg></span>
  <span class="btn" title="Próximo" onclick="nav('n')"><svg width="16" height="16"><path d="M2 3l6 5-6 5zM8 3l6 5-6 5z" fill="#1c2a8c"/></svg></span>
  <span class="btn" title="Último" onclick="nav('u')"><svg width="16" height="16"><path d="M12 3v10M3 3l7 5-7 5z" fill="#1c2a8c" stroke="#1c2a8c"/></svg></span>
</div>

<div class="tabs"><div class="tab">Identificação</div></div>

<div class="form">
  <div id="lookup" style="display:none;position:absolute;left:402px;top:56px;width:420px;background:#fff;border:1px solid #808080;box-shadow:2px 2px 6px rgba(0,0,0,.3);z-index:10">
    <div style="background:#3c3c64;color:#fff;font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between">Contas Contábeis<span style="cursor:pointer" onclick="fechaLookup()">✕</span></div>
    <div style="padding:4px"><input type="text" id="lkFiltro" placeholder="Localizar..." style="width:100%" oninput="montaLookup()"></div>
    <div style="height:150px;overflow:auto"><table><colgroup><col style="width:100px"><col></colgroup>
      <thead><tr><th>Código</th><th>Descrição</th></tr></thead><tbody id="lkBody"></tbody></table></div>
  </div>
  <div class="f" style="left:0;top:10px"><span class="lbl" style="width:106px">Código</span><input type="text" id="codigo" style="width:90px" maxlength="10" readonly></div>
  <div class="f" style="left:196px;top:10px"><span class="lbl" style="width:110px">Descrição do Ativo</span><input type="text" id="descricao" style="width:440px"></div>

  <div class="f" style="left:0;top:34px"><span class="lbl" style="width:106px">Valor Saldo Inicial</span><input type="text" id="valor" class="num" style="width:200px"></div>
  <div class="f" style="left:306px;top:34px"><span class="lbl lnk" style="width:90px" onclick="abreLookup()">Conta Contábil</span>
    <select id="conta" style="width:360px">
      <option value=""></option>
      <option>1.1.1.01.001 - Aplicações Financeiras Renda Fixa</option>
      <option>1.1.1.01.002 - Aplicações Financeiras Renda Variável</option>
      <option>1.1.1.02.001 - CDB e Títulos de Renda Fixa</option>
      <option>1.1.1.02.002 - Fundos de Investimento Conservador</option>
      <option>1.1.1.03.001 - Poupança e Depósitos de Curto Prazo</option>
      <option>1.1.1.04.001 - Ações e Títulos Patrimoniais</option>
      <option>1.1.1.04.002 - Fundos Multimercado</option>
      <option>1.1.1.05.001 - Derivativos e Operações Estruturadas</option>
      <option>1.1.1.06.001 - Operações com Moeda Estrangeira</option>
      <option>1.1.1.07.001 - Aplicações Financeiras em Fase de Liquidação</option>
    </select>
  </div>
</div>

<script>
  var campos = ['codigo', 'descricao', 'valor', 'conta'];
  var dados = [{ codigo: '0000000001', descricao: 'CDB Banco Teste', valor: '10.000,00', conta: '1.1.1.02.001 - CDB e Títulos de Renda Fixa' }];
  var atual = 0, editando = false;

  function $(id) { return document.getElementById(id); }

  function render() {
    var tb = $('gridBody'); tb.innerHTML = '';
    dados.forEach(function (d, i) {
      var tr = document.createElement('tr');
      if (i === atual) tr.className = 'rsel';
      ['codigo', 'descricao', 'valor', 'conta'].forEach(function (k) {
        var td = document.createElement('td'); td.textContent = d[k];
        if (k === 'valor') td.className = 'r';
        tr.appendChild(td);
      });
      tr.onclick = function () { if (!editando) { atual = i; render(); } };
      tb.appendChild(tr);
    });
    carregaTela();
  }

  function carregaTela() {
    var d = dados[atual] || {};
    campos.forEach(function (c) { $(c).value = d[c] || ''; $(c).classList.remove('err'); });
  }

  function modoEdicao(on) {
    editando = on;
    $('codigo').readOnly = !on || atual !== -1;
    $('bSalvar').classList.toggle('dis', !on);
    $('bCancelar').classList.toggle('dis', !on);
    $('bNovo').classList.toggle('dis', on);
  }

  function proximoCodigo() {
    var max = dados.reduce(function (m, d) { return Math.max(m, parseInt(d.codigo, 10) || 0); }, 0);
    return String(max + 1).padStart(10, '0');
  }

  function novo() {
    atual = -1; render();
    modoEdicao(true);
    $('codigo').value = proximoCodigo();
    $('descricao').focus();
  }

  function salvar() {
    var ok = true, reg = {};
    campos.forEach(function (c) {
      reg[c] = $(c).value.trim();
      $(c).classList.toggle('err', !reg[c]);
      if (!reg[c]) ok = false;
    });
    if (!ok) { alert('Preencha os campos obrigatórios.'); return; }
    var v = parseFloat(reg.valor.replace(/\./g, '').replace(',', '.'));
    if (isNaN(v)) { $('valor').classList.add('err'); alert('Valor Saldo Inicial inválido.'); return; }
    reg.valor = v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    reg.codigo = reg.codigo.padStart(10, '0');
    if (atual === -1) { dados.push(reg); atual = dados.length - 1; } else { dados[atual] = reg; }
    modoEdicao(false); render();
  }

  function cancelar() {
    if (atual === -1) atual = dados.length ? 0 : -1;
    modoEdicao(false); render();
  }

  function excluir() {
    if (editando || atual < 0 || !dados.length) return;
    if (!confirm('Deseja excluir esta aplicação?')) return;
    dados.splice(atual, 1);
    atual = dados.length ? Math.min(atual, dados.length - 1) : -1;
    render();
  }

  function nav(t) {
    if (editando || !dados.length) return;
    if (t === 'p') atual = 0;
    if (t === 'u') atual = dados.length - 1;
    if (t === 'a') atual = Math.max(0, atual - 1);
    if (t === 'n') atual = Math.min(dados.length - 1, atual + 1);
    render();
  }

  // Duplo clique no campo habilita alteração do registro selecionado
  document.querySelector('.form').addEventListener('dblclick', function () {
    if (!editando && atual >= 0) modoEdicao(true);
  });

  // Conta Contábil: escolher uma conta fora da edição entra em modo de alteração
  $('conta').addEventListener('change', function () {
    if (!editando) { var v = this.value; if (atual < 0) return; modoEdicao(true); this.value = v; }
  });

  function contas() {
    return Array.prototype.slice.call($('conta').options).filter(function (o) { return o.value; })
      .map(function (o) { var p = o.value.split(' - '); return { cod: p[0], desc: p.slice(1).join(' - '), full: o.value }; });
  }

  function montaLookup() {
    var f = $('lkFiltro').value.toLowerCase(), tb = $('lkBody'); tb.innerHTML = '';
    contas().filter(function (c) { return !f || c.full.toLowerCase().indexOf(f) >= 0; }).forEach(function (c) {
      var tr = document.createElement('tr');
      if (c.full === $('conta').value) tr.className = 'rsel';
      tr.innerHTML = '<td></td><td></td>';
      tr.cells[0].textContent = c.cod; tr.cells[1].textContent = c.desc;
      tr.ondblclick = function () {
        if (!editando && atual >= 0) modoEdicao(true);
        if (editando) $('conta').value = c.full;
        fechaLookup();
      };
      tb.appendChild(tr);
    });
  }

  function abreLookup() { $('lkFiltro').value = ''; montaLookup(); $('lookup').style.display = 'block'; $('lkFiltro').focus(); }
  function fechaLookup() { $('lookup').style.display = 'none'; }

  // Digitar em qualquer campo entra em modo de alteração (habilita Salvar/Cancelar)
  ['descricao', 'valor'].forEach(function (c) {
    $(c).addEventListener('input', function () { if (!editando && atual >= 0) modoEdicao(true); });
  });

  function localizar() {
    if (editando || !dados.length) return;
    var t = prompt('Localizar (código, descrição ou conta):');
    if (!t) return;
    t = t.toLowerCase();
    var ini = atual + 1;
    for (var k = 0; k < dados.length; k++) {
      var i = (ini + k) % dados.length, d = dados[i];
      if ((d.codigo + ' ' + d.descricao + ' ' + d.conta).toLowerCase().indexOf(t) >= 0) { atual = i; render(); return; }
    }
    alert('Nenhum registro encontrado.');
  }

  function relatorio() {
    var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    var linhas = dados.map(function (d) {
      return '<tr><td>' + esc(d.codigo) + '</td><td>' + esc(d.descricao) + '</td><td style="text-align:right">' + esc(d.valor) + '</td><td>' + esc(d.conta) + '</td></tr>';
    }).join('');
    var w = window.open('', '_blank');
    if (!w) { alert('Permita pop-ups para gerar o relatório.'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Relatório - Aplicações Financeiras</title>' +
      '<style>body{font-family:Tahoma,Arial;font-size:11px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:3px}th{background:#eee;text-align:left}</style></head><body>' +
      '<h3>Aplicações Financeiras</h3><p>Emitido em ' + new Date().toLocaleString('pt-BR') + '</p>' +
      '<table><tr><th>Código</th><th>Descrição do Ativo</th><th>Valor Saldo Inicial</th><th>Conta Contábil</th></tr>' + linhas + '</table>' +
      '<script>window.print()<\/script></body></html>');
    w.document.close();
  }

  function calcularDeRE() {
    window.open('https://ricardopaivak.github.io/dere_eventos_mensais/', '_blank');
  }

  render();
</script>
</body>
</html>
